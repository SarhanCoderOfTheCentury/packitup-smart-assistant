version: "3.9"

services:
  fastapi-backend:
    build: .
    container_name: packitup-fastapi
    command: uvicorn src.backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  streamlit-frontend:
    build: .
    container_name: packitup-streamlit
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - AGENT_EXECUTION_MODE=fastapi
      - FASTAPI_URL=http://fastapi-backend:8000
    volumes:
      - ./data:/app/data
    depends_on:
      - fastapi-backend
